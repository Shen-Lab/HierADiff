---
 # file is parsed by inner-most keys only
 data:
     dataset: dips
     data_file: datasets/DB5/splits.csv ######
     data_path: datasets/DB5/pairs_pruned
     resolution: residue
     no_graph_cache: False ####
     knn_size: 20
     use_orientation_features: False
     multiplicity: 1


     filter_len_r_plus_l_max: 0
     subset: null

     shuffle: True

     randomRL: True

 model:
     use_nm_msf_feat: True
     use_nm_mode_correlation_feat: True


     natural_exp: True
     c: 5.0
    #  intra_equi_nm_node_f: True
    #  expanded_edge_w_l0_features: True
    #  expanded_edge_w_freq_features: True

     model_type: flexFM_Rt

     res_rot_flex: True
     FAPE_loss: True
    #  subset: /scratch/user/rujieyin/DyDock/datasets/DIPS/hetero_data_excludeOne.csv


     recLigMismatchingInterLayer: True
     num_conv_layers: 5
     indReadoutFlex_sharedWeight: True

     readOutInterAttentionFeature: True #####


     attention: False

     no_nm: False
     no_batch_norm: True
     lm_embed_dim: 1280
     dropout: 0.0
     dynamic_max_cross: False
     cross_cutoff_weight: 3
     cross_cutoff_bias: 40
     cross_max_dist: 80

     ns: 32
     nv: 8
     dist_embed_dim: 32
     cross_dist_embed_dim: 32
     sigma_embed_dim: 32
     max_radius: 5.
 train:
     patience: 150
     epochs: 2000
     lr: 2.e-4
     weight_decay: 0.
     tr_weight: 1
     rot_weight: 1
     flex_rot_weight: 1
     flex_tr_weight: 1
     flex_fape_weight: 1
     lddt_weight: 1
     val_inference_freq: 10
     num_steps: 40
 diffusion:
     tr_s_min: 0.01
     tr_s_max: 30.0
     rot_s_min: 0.01
     rot_s_max: 1.65
     sample_train: True
     num_inference_complexes_train_data: 1200